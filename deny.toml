[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "unmaintained optional bincode dependency outside the active Windows graph; tracked in dependency review" },
    { id = "RUSTSEC-2024-0436", reason = "unmaintained paste proc macro in Lofty/Slint build graph; tracked in dependency review" },
    { id = "RUSTSEC-2026-0206", reason = "unmaintained rustybuzz through Slint; tracked until the next Slint upgrade" },
    { id = "RUSTSEC-2026-0192", reason = "unmaintained ttf-parser through Slint; tracked until the next Slint upgrade" },
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-2.1",
    "MIT",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
