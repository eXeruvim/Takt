[package]
name = "oxide"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1.17.1", features = ["raw-window-handle-06"] }
libmpv = {
    git = "https://github.com/ParadoxSpiral/libmpv-rs.git",
    default-features = false
}
crossbeam-channel = "0.5.16"
anyhow = "1.0.104"
raw-window-handle = "0.6.0"
rfd = "0.17.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[build-dependencies]
slint-build = { version = "1.17.1" }
