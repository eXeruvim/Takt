[package]
name = "oxide"
version = "0.9.0-alpha.29"
edition = "2024"
build = "build.rs"

[features]
default = []
benchmark-tools = []

[[bin]]
name = "oxide-playlist-bench"
path = "src/playlist_bench.rs"
required-features = ["benchmark-tools"]

[dependencies]
slint = { version = "1.17.1", default-features = false, features = [
    "raw-window-handle-06",
    "unstable-winit-030",
    "renderer-femtovg",
    "compat-1-2",
] }
libmpv = { path = "vendor/libmpv", default-features = false }
libmpv-sys = { git = "https://github.com/ParadoxSpiral/libmpv-rs.git", rev = "3e6c389b716f52a595cc5e8e3fa1f96cb76b3de7" }
crossbeam-channel = { version = "0.5.16", default-features = false }
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
] }
lofty = { version = "0.25.1", default-features = true }
raw-window-handle = { version = "0.6.2", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["serde"] }
serde_json = "1.0.145"
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[build-dependencies]
slint-build = { version = "1.17.1" }

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
