[package]
name = "takt"
version = "1.0.0"
edition = "2024"
build = "build.rs"
license = "GPL-3.0-or-later"
description = "Video and audio player built with Rust, Slint, and libmpv"
readme = "README.md"
publish = false

[features]
default = []
benchmark-tools = []
fuzzing = []
windows-gui = []

[[bin]]
name = "takt-playlist-bench"
path = "src/playlist_bench.rs"
required-features = ["benchmark-tools"]

[[bin]]
name = "takt-update-manifest"
path = "src/bin/takt_update_manifest.rs"

[[bin]]
name = "takt-updater"
path = "src/bin/takt_updater.rs"

[dependencies]
slint = { version = "1.17.1", default-features = false, features = [
    "raw-window-handle-06",
    "unstable-winit-030",
    "renderer-femtovg",
    "compat-1-2",
] }
libmpv = { version = "=2.0.1", path = "vendor/libmpv", default-features = false }
libmpv-sys = { version = "=3.1.0", path = "vendor/libmpv-sys" }
crossbeam-channel = { version = "0.5.16", default-features = false }
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
] }
lofty = { version = "0.25.1", default-features = true }
raw-window-handle = { version = "0.6.2", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["serde"] }
serde_json = "1.0.145"
serde = { version = "=1.0.229", features = ["derive"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
ed25519-dalek = "=3.0.0"
semver = { version = "=1.0.28", default-features = false, features = ["std"] }
sha2 = "=0.11.1"
url = "=2.5.8"
getrandom = "=0.3.4"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[build-dependencies]
slint-build = { version = "1.17.1" }
winresource = "=0.1.34"

[package.metadata.winresource]
CompanyName = "Takt contributors"
FileDescription = "Takt media player"
InternalName = "takt"
LegalCopyright = "Copyright © 2026 Takt contributors"
OriginalFilename = "takt.exe"
ProductName = "Takt"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
