[package]
name = "oxide"
version = "0.8.0-alpha.1"
edition = "2024"
build = "build.rs"

[dependencies]
slint = { version = "1.17.1", default-features = false, features = [
    "raw-window-handle-06",
    "unstable-winit-030",
    "renderer-femtovg",
    "compat-1-2"
] }
libmpv = { git = "https://github.com/ParadoxSpiral/libmpv-rs.git", default-features = false }
libmpv-sys = { git = "https://github.com/ParadoxSpiral/libmpv-rs.git" }
crossbeam-channel = { version = "0.5.16", default-features = false }
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png"] }
lofty = "0.25.1"
raw-window-handle = {version = "0.6.2", default-features = false }
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
slint-build = { version = "1.17.1" }
