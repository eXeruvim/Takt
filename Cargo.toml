[package]
name = "oxide"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1.5.0", default-features = false, features = ["backend-wgpu", "renderer-winit", "std"] }
libmpv = { version = "2.0.1", default-features = false }
crossbeam-channel = { version = "0.5.11", default-features = false, features = ["std"] }
anyhow = { version = "1.0.81", default-features = false, features = ["std"] }
raw-window-handle = { version = "0.6.0", default-features = false, features = ["std"] }

[build-dependencies]
slint-build = { version = "1.5.0", default-features = false }