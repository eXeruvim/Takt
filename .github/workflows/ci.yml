name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.94.1
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        run: cargo audit

  license-and-sbom:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Provision verified native runtime
        shell: pwsh
        run: ./scripts/fetch-native-runtime.ps1
      - name: Install pinned compliance tools
        shell: pwsh
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify licenses, sources and reproducible SBOM
        shell: pwsh
        run: |
          ./scripts/build-compliance-bundle.ps1 -RequireReleaseRuntime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = (Get-FileHash sbom/oxide.cdx.json -Algorithm SHA256).Hash
          $actual = (Get-FileHash artifacts/compliance/oxide.cdx.json -Algorithm SHA256).Hash
          if ($expected -ne $actual) {
            throw "Tracked SBOM is stale: $expected != $actual"
          }
      - name: Upload compliance bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: oxide-compliance
          path: artifacts/compliance
          if-no-files-found: error

  quality:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Provision verified native runtime
        shell: pwsh
        run: |
          ./scripts/fetch-native-runtime.ps1
          $runtime = (Resolve-Path artifacts/native-runtime).Path
          "RUSTFLAGS=-Lnative=$runtime -Clink-arg=-fuse-ld=lld" >> $env:GITHUB_ENV
          $runtime >> $env:GITHUB_PATH
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check
        run: cargo check --locked --all-targets --all-features
      - name: Tests with verified native libmpv
        shell: pwsh
        run: |
          cargo test --locked --all-targets --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p libmpv --lib ownership_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Unit tests can discard imports used only by the GUI entry point.
          # Load the real application without starting its UI or player.
          cargo run --locked --bin oxide -- --build-info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify-native-runtime.ps1

  release-package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Provision verified build tools
        shell: pwsh
        run: |
          ./scripts/fetch-native-runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/fetch-installer-tool.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tool = Get-Content release/installer-tool.json -Raw | ConvertFrom-Json
          $installer = "artifacts/tooling/innosetup-$($tool.version)-x64.exe"
          $toolDirectory = Join-Path $env:RUNNER_TEMP "InnoSetup-$($tool.version)"
          $process = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$toolDirectory"
          ) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }
          "ISCC_PATH=$(Join-Path $toolDirectory 'ISCC.exe')" >> $env:GITHUB_ENV
      - name: Build and smoke-test release artifacts
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($version -notmatch '-') {
            $env:OXIDE_UPDATE_MANIFEST_URL = "https://github.com/${{ github.repository }}/releases/latest/download/oxide-update-stable.json"
          }
          ./scripts/build-installer.ps1 -Compiler $env:ISCC_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-updater.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-installer.ps1
      - name: Sign update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          OXIDE_UPDATE_SIGNING_KEY: ${{ secrets.OXIDE_UPDATE_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OXIDE_UPDATE_SIGNING_KEY)) {
            throw 'Repository secret OXIDE_UPDATE_SIGNING_KEY is required for a tagged release.'
          }
          ./scripts/build-update-manifest.ps1 -Repository $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload release candidate
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: oxide-windows-release
          path: artifacts/release
          if-no-files-found: error
      - name: Validate tag and publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version\s*=\s*"([^"]+)"\s*$') {
            throw 'Cannot read Cargo package version.'
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version v$version."
          }
          $channel = if ($version -match '-alpha(?:\.|$)') {
            'alpha'
          } elseif ($version -match '-(?:beta|rc)(?:\.|$)') {
            'beta'
          } elseif ($version -notmatch '-') {
            'stable'
          } else {
            throw "Unknown release channel in version $version."
          }
          $assets = @(
            "artifacts/release/Oxide-$version-setup-x86_64.exe",
            "artifacts/release/Oxide-$version-windows-x86_64.zip",
            "artifacts/release/Oxide-$version-sbom.cdx.json",
            "artifacts/release/Oxide-$version-native-runtime.cdx.json",
            "artifacts/release/Oxide-$version-THIRD-PARTY-NOTICES.md",
            "artifacts/release/Oxide-$version-CODEC-MATRIX.md",
            "artifacts/release/oxide-update-$channel.json",
            'artifacts/release/SHA256SUMS.txt'
          )
          $arguments = @('release', 'create', $env:GITHUB_REF_NAME) + $assets + @(
            '--verify-tag', '--generate-notes', '--title', "Oxide $version"
          )
          if ($version.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
