name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.94.1
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        run: cargo audit

  license-and-sbom:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Provision verified native runtime
        shell: pwsh
        run: ./scripts/fetch-native-runtime.ps1
      - name: Install pinned compliance tools
        shell: pwsh
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify licenses, sources and reproducible SBOM
        shell: pwsh
        run: |
          ./scripts/build-compliance-bundle.ps1 -RequireReleaseRuntime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = (Get-FileHash sbom/oxide.cdx.json -Algorithm SHA256).Hash
          $actual = (Get-FileHash artifacts/compliance/oxide.cdx.json -Algorithm SHA256).Hash
          if ($expected -ne $actual) {
            throw "Tracked SBOM is stale: $expected != $actual"
          }
      - name: Upload compliance bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: oxide-compliance
          path: artifacts/compliance
          if-no-files-found: error

  quality:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Provision verified native runtime
        shell: pwsh
        run: |
          ./scripts/fetch-native-runtime.ps1
          $runtime = (Resolve-Path artifacts/native-runtime).Path
          "RUSTFLAGS=-Lnative=$runtime -Clink-arg=-fuse-ld=lld" >> $env:GITHUB_ENV
          $runtime >> $env:GITHUB_PATH
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check
        run: cargo check --locked --all-targets --all-features
      - name: Tests with verified native libmpv
        shell: pwsh
        run: |
          cargo test --locked --all-targets --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p libmpv --lib ownership_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Unit tests can discard imports used only by the GUI entry point.
          # Load the real application without starting its UI or player.
          cargo run --locked --bin oxide -- --build-info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify-native-runtime.ps1
